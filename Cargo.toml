[package]
name = "agent-mail"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "env"] }
dirs = "7.0.0"
imap = "3.0.0-alpha.15"
imap-proto = "0.16.7"
keyring = { version = "3", features = ["apple-native"] }
mail-builder = "2.0.1"
mail-parser = "0.11.9"
native-tls = "0.2.18"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"
ureq = { version = "3", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
